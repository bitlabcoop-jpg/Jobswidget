name: APK bauen
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Projekt erzeugen
        run: |
          mkdir -p P && cd P
          mkdir -p .
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "JobsWidget"
          include(":app")
          EOF
          mkdir -p .
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          mkdir -p .
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "de.jobswidget"
              compileSdk = 34

              defaultConfig {
                  applicationId = "de.jobswidget"
                  minSdk = 31
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:label="@string/app_name"
                  android:allowBackup="true">

                  <receiver
                      android:name=".QuoteWidget"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="android.intent.action.DATE_CHANGED" />
                          <action android:name="android.intent.action.TIME_SET" />
                          <action android:name="android.intent.action.TIMEZONE_CHANGED" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/quote_widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/quote_widget_info.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:resizeMode="horizontal|vertical"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_quote"
              android:previewLayout="@layout/widget_quote"
              android:description="@string/widget_description"
              android:widgetCategory="home_screen" />
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Jobs Weisheit</string>
              <string name="widget_description">Jeden Tag eine neue Weisheit von Steve Jobs</string>
          </resources>
          EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/widget_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:angle="315"
                  android:startColor="#0F0F14"
                  android:endColor="#1F1B3A"
                  android:type="linear" />
              <corners android:radius="28dp" />
              <stroke android:width="1dp" android:color="#33FFFFFF" />
          </shape>
          EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/accent_bar.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:angle="270"
                  android:startColor="#FF7A59"
                  android:endColor="#C86BFA" />
              <corners android:radius="2dp" />
          </shape>
          EOF
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/widget_quote.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_bg"
              android:orientation="vertical"
              android:padding="18dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal">

                  <View
                      android:layout_width="28dp"
                      android:layout_height="4dp"
                      android:layout_gravity="center_vertical"
                      android:background="@drawable/accent_bar" />

                  <TextView
                      android:id="@+id/widget_label"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:layout_marginStart="10dp"
                      android:text="WEISHEIT DES TAGES"
                      android:textColor="#99FFFFFF"
                      android:textSize="10sp"
                      android:letterSpacing="0.2"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/widget_date"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text=""
                      android:textColor="#66FFFFFF"
                      android:textSize="10sp" />
              </LinearLayout>

              <TextView
                  android:id="@+id/widget_quote"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:gravity="center_vertical"
                  android:paddingTop="6dp"
                  android:paddingBottom="6dp"
                  android:fontFamily="serif"
                  android:text="„Bleibt hungrig, bleibt verrückt.“"
                  android:textColor="#FFFFFF"
                  android:textSize="18sp"
                  android:lineSpacingMultiplier="1.1" />

              <TextView
                  android:id="@+id/widget_author"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="— Steve Jobs"
                  android:textColor="#FF8A6B"
                  android:textSize="13sp"
                  android:textStyle="bold" />
          </LinearLayout>
          EOF
          mkdir -p app/src/main/java/de/jobswidget
          cat > app/src/main/java/de/jobswidget/Quotes.kt <<'EOF'
          package de.jobswidget

          object Quotes {
              val all = listOf(
                  "Bleibt hungrig, bleibt verrückt.",
                  "Deine Zeit ist begrenzt. Verschwende sie nicht damit, das Leben eines anderen zu leben.",
                  "Die einzige Art, großartige Arbeit zu leisten, ist zu lieben, was man tut.",
                  "Innovation unterscheidet einen Anführer von einem Mitläufer.",
                  "Design ist nicht nur, wie etwas aussieht und sich anfühlt. Design ist, wie etwas funktioniert.",
                  "Einfach zu sein ist schwieriger als kompliziert zu sein. Man muss hart arbeiten, um das Denken klar und einfach zu machen.",
                  "Hab den Mut, deinem Herzen und deiner Intuition zu folgen. Sie wissen bereits, was du wirklich werden willst.",
                  "Qualität ist wichtiger als Quantität. Ein Homerun ist besser als zwei Doubles.",
                  "Die Leute wissen oft nicht, was sie wollen, bis man es ihnen zeigt.",
                  "Ich bin genauso stolz auf das, was wir nicht tun, wie auf das, was wir tun.",
                  "Manchmal trifft dich das Leben mit einem Ziegelstein am Kopf. Verlier nicht den Glauben.",
                  "Fokus bedeutet, Nein zu sagen.",
                  "Große Dinge im Business schafft nie eine einzelne Person. Sie entstehen im Team.",
                  "Du kannst die Punkte nicht vorausschauend verbinden, nur rückblickend. Vertraue darauf, dass sie sich irgendwann fügen.",
                  "Echte Künstler liefern ab.",
                  "Es macht mehr Spaß, ein Pirat zu sein, als zur Marine zu gehen.",
                  "Ich möchte eine Delle im Universum hinterlassen.",
                  "Zu entscheiden, was man nicht tut, ist genauso wichtig, wie zu entscheiden, was man tut.",
                  "Lass den Lärm fremder Meinungen nicht deine innere Stimme übertönen.",
                  "Kreativität heißt, Dinge miteinander zu verbinden.",
                  "Zeit ist die kostbarste Ressource, die wir haben.",
                  "Details sind wichtig. Es lohnt sich zu warten, bis es richtig ist.",
                  "Die Hälfte dessen, was erfolgreiche Unternehmer von den anderen trennt, ist reine Beharrlichkeit."
              )
          }
          EOF
          mkdir -p app/src/main/java/de/jobswidget
          cat > app/src/main/java/de/jobswidget/QuoteWidget.kt <<'EOF'
          package de.jobswidget

          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews
          import java.time.LocalDate
          import java.time.format.DateTimeFormatter
          import java.util.Locale

          class QuoteWidget : AppWidgetProvider() {

              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray
              ) {
                  for (id in appWidgetIds) {
                      appWidgetManager.updateAppWidget(id, buildViews(context))
                  }
              }

              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent)
                  if (intent.action == Intent.ACTION_DATE_CHANGED ||
                      intent.action == Intent.ACTION_TIME_CHANGED ||
                      intent.action == Intent.ACTION_TIMEZONE_CHANGED
                  ) {
                      val mgr = AppWidgetManager.getInstance(context)
                      val ids = mgr.getAppWidgetIds(ComponentName(context, QuoteWidget::class.java))
                      onUpdate(context, mgr, ids)
                  }
              }

              private fun buildViews(context: Context): RemoteViews {
                  val today = LocalDate.now()
                  val quotes = Quotes.all
                  val index = (today.toEpochDay() % quotes.size).toInt()

                  return RemoteViews(context.packageName, R.layout.widget_quote).apply {
                      setTextViewText(R.id.widget_quote, "„${quotes[index]}“")
                      setTextViewText(R.id.widget_author, "— Steve Jobs")
                      setTextViewText(
                          R.id.widget_date,
                          today.format(DateTimeFormatter.ofPattern("d. MMM", Locale.GERMAN))
                      )
                  }
              }
          }
          EOF
      - name: APK bauen
        run: gradle assembleDebug
        working-directory: P
      - uses: actions/upload-artifact@v4
        with:
          name: JobsWidget-APK
          path: P/app/build/outputs/apk/debug/app-debug.apk
